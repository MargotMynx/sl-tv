<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #player, #html5-video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    /* Floating UI Overlay Controls */
    .control-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #player-container:hover .control-bar {
      opacity: 1;
      pointer-events: auto;
    }

    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn:hover { background: #444; }
    .btn-resync { background: #1d4ed8; border-color: #3b82f6; }
    .btn-resync:hover { background: #2563eb; }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 14px;
      user-select: none;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: #555;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: #60a5fa;
    }
  </style>

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div id="player-container">
    <div class="control-bar">
      <div class="volume-container">
        <span id="volIcon">🔊</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
      </div>
      <button class="btn btn-resync" onclick="broadcastResync()">🔄 Resync All</button>
      <button class="btn" id="playPauseBtn" onclick="broadcastTogglePlay()">⏯️ Pause</button>
    </div>
    <div id="player"></div>
  </div>

  <script>
    // --- 1. FIREBASE CONFIGURATION ---
    const FIREBASE_DB_URL = "https://player-4fa3d-default-rtdb.firebaseio.com/";

    firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = firebase.database().ref('room_session');

    // --- 2. LOCAL STATE & PARSING ---
    let ytPlayer = null;
    let html5Player = null;
    let isHtml5 = false;
    let isPausedLocal = false;

    const params = new URLSearchParams(window.location.search);
    const videoParam = params.get('v') || '';
    const startEpoch = parseInt(params.get('start') || '0', 10);

    function getCalculatedStart() {
      if (!startEpoch) return 0;
      const nowUnix = Math.floor(Date.now() / 1000);
      const elapsed = nowUnix - startEpoch;
      return elapsed > 0 ? elapsed : 0;
    }

    function isDirectFile(url) {
      return url.startsWith('http://') || url.startsWith('https://');
    }

    // --- 3. INITIALIZATION ---
    window.onload = function() {
      if (!videoParam || videoParam === 'blank') return;

      const startTime = getCalculatedStart();

      if (isDirectFile(videoParam)) {
        // Direct MP4 / WebM File
        isHtml5 = true;
        const container = document.getElementById('player-container');
        document.getElementById('player').remove();

        html5Player = document.createElement('video');
        html5Player.id = 'html5-video';
        html5Player.src = videoParam;
        html5Player.autoplay = true;
        html5Player.controls = true;
        container.appendChild(html5Player);

        html5Player.addEventListener('loadedmetadata', () => {
          if (startTime > 0 && startTime < html5Player.duration) {
            html5Player.currentTime = startTime;
          }
        });

        listenForRealtimeUpdates();
      } else {
        // YouTube API Video
        isHtml5 = false;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
      }
    };

    function onYouTubeIframeAPIReady() {
      if (isHtml5 || !videoParam || videoParam === 'blank') return;

      const startTime = getCalculatedStart();

      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoParam,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'enablejsapi': 1,
          'rel': 0,
          'modestbranding': 1,
          'start': startTime
        },
        events: {
          'onReady': listenForRealtimeUpdates
        }
      });
    }

    // --- 4. VOLUME CONTROL ---
    function changeVolume(val) {
      if (isHtml5 && html5Player) {
        html5Player.volume = val / 100;
      } else if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
      
      const icon = document.getElementById('volIcon');
      if (val == 0) {
        icon.innerText = '🔇';
      } else if (val < 50) {
        icon.innerText = '🔉';
      } else {
        icon.innerText = '🔊';
      }
    }

    // --- 5. FIREBASE REALTIME LISTENERS ---
    function listenForRealtimeUpdates() {
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.action === 'pause') {
          isPausedLocal = true;
          document.getElementById('playPauseBtn').innerText = '▶️ Play';
          if (isHtml5 && html5Player) {
            html5Player.pause();
          } else if (ytPlayer && ytPlayer.pauseVideo) {
            ytPlayer.pauseVideo();
          }
        } 
        else if (data.action === 'play') {
          isPausedLocal = false;
          document.getElementById('playPauseBtn').innerText = '⏯️ Pause';
          if (isHtml5 && html5Player) {
            html5Player.play();
          } else if (ytPlayer && ytPlayer.playVideo) {
            ytPlayer.playVideo();
          }
        } 
        else if (data.action === 'resync') {
          const targetTime = getCalculatedStart();
          isPausedLocal = false;
          document.getElementById('playPauseBtn').innerText = '⏯️ Pause';

          if (isHtml5 && html5Player) {
            html5Player.currentTime = targetTime;
            html5Player.play();
          } else if (ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(targetTime, true);
            ytPlayer.playVideo();
          }
        }
      });
    }

    // --- 6. FIREBASE BROADCASTS ---
    function broadcastResync() {
      db.set({
        action: 'resync',
        timestamp: Date.now()
      });
    }

    function broadcastTogglePlay() {
      const nextAction = isPausedLocal ? 'play' : 'pause';
      db.set({
        action: nextAction,
        timestamp: Date.now()
      });
    }
  </script>
</body>
</html>
