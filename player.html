<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
    let player;
    let startEpoch = 0;
    let isPausedState = false;
    let pauseOffset = 0;

    // Load YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        v: params.get('v'),
        start: parseInt(params.get('start') || '0', 10), // Unix Epoch Start Time
        paused: params.get('paused') === '1',
        ptime: parseInt(params.get('ptime') || '0', 10)  // Paused position
      };
    }

    function calculateTargetTime(p) {
      if (p.paused) return p.ptime;
      const currentUnix = Math.floor(Date.now() / 1000);
      const elapsed = currentUnix - p.start;
      return elapsed > 0 ? elapsed : 0;
    }

    function onYouTubeIframeAPIReady() {
      const p = getParams();
      if (!p.v) return;

      const targetTime = calculateTargetTime(p);

      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: p.v,
        playerVars: {
          'autoplay': p.paused ? 0 : 1,
          'controls': 1,
          'enablejsapi': 1,
          'rel': 0,
          'modestbranding': 1,
          'start': targetTime
        }
      });
    }
  </script>
</body>
</html>
