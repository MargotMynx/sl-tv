<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #player {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating UI Overlay Controls */
    .control-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn:hover { background: #444; }
    .btn-resync { background: #1d4ed8; border-color: #3b82f6; }
    .btn-resync:hover { background: #2563eb; }
  </style>

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div id="player-container">
    <div class="control-bar">
      <button class="btn btn-resync" onclick="broadcastResync()">🔄 Resync All</button>
      <button class="btn" id="playPauseBtn" onclick="broadcastTogglePlay()">⏯️ Pause</button>
    </div>
    <div id="player"></div>
  </div>

  <script>
    // --- 1. FIREBASE CONFIGURATION ---
    const FIREBASE_DB_URL = "https://player-4fa3d-default-rtdb.firebaseio.com/";

    firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = firebase.database().ref('room_session');

    // --- 2. LOCAL STATE ---
    let player;
    let isPausedLocal = false;

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');
    const startEpoch = parseInt(params.get('start') || '0', 10);

    function getCalculatedStart() {
      if (!startEpoch) return 0;
      const nowUnix = Math.floor(Date.now() / 1000);
      const elapsed = nowUnix - startEpoch;
      return elapsed > 0 ? elapsed : 0;
    }

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      if (!videoId) return;

      const startTime = getCalculatedStart();

      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'enablejsapi': 1,
          'rel': 0,
          'modestbranding': 1,
          'start': startTime
        },
        events: {
          'onReady': listenForRealtimeUpdates
        }
      });
    }

    // --- 3. LISTEN FOR INCOMING COMMANDS FROM FIREBASE ---
    function listenForRealtimeUpdates() {
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || !player) return;

        if (data.action === 'pause') {
          player.pauseVideo();
          isPausedLocal = true;
          document.getElementById('playPauseBtn').innerText = '▶️ Play';
        } 
        else if (data.action === 'play') {
          player.playVideo();
          isPausedLocal = false;
          document.getElementById('playPauseBtn').innerText = '⏯️ Pause';
        } 
        else if (data.action === 'resync') {
          const targetTime = getCalculatedStart();
          player.seekTo(targetTime, true);
          if (isPausedLocal) {
            player.playVideo();
            isPausedLocal = false;
            document.getElementById('playPauseBtn').innerText = '⏯️ Pause';
          }
        }
      });
    }

    // --- 4. BROADCAST COMMANDS TO FIREBASE ---
    function broadcastResync() {
      db.set({
        action: 'resync',
        timestamp: Date.now()
      });
    }

    function broadcastTogglePlay() {
      const nextAction = isPausedLocal ? 'play' : 'pause';
      db.set({
        action: nextAction,
        timestamp: Date.now()
      });
    }
  </script>
</body>
</html>
